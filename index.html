<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      max-width: 450px;
    }
    .campo {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    input {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.7rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #0056b3;
      color: #fff;
      border: none;
      border-radius: 4px;
      width: 100%;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #mensaje {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Registro de Datos</h2>

  <form id="miFormulario">
    <div class="campo">
      <label for="nombre">Nombre y apellido del titular:</label>
      <input type="text" id="nombre" name="entry.1660275454" required>
    </div>

    <div class="campo">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="entry.1122720499" required>
    </div>

    <div class="campo">
      <label for="servicio">Número del servicio:</label>
      <input type="text" id="servicio" name="entry.1091301635" required>
    </div>

    <div class="campo">
      <label for="cedula">Cédula de Identidad del titular:</label>
      <input type="text" id="cedula" name="entry.1398348628" required>
    </div>

    <div class="campo">
      <label for="celular1">Número celular de contacto (1):</label>
      <input type="tel" id="celular1" name="entry.1915320890" required>
    </div>

    <div class="campo">
      <label for="celular2">Número celular de contacto (2):</label>
      <input type="tel" id="celular2" name="entry.951965866">
    </div>

    <button type="submit" id="btnEnviar">Enviar datos</button>
  </form>

  <p id="mensaje"></p>

  <script>
    const form = document.getElementById('miFormulario');
    const mensaje = document.getElementById('mensaje');
    const btnEnviar = document.getElementById('btnEnviar');

    // Endpoint de Google Forms que procesa las respuestas
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfwqghKzCNBuzDNv_xFhtOvElcfnfsQrtQg2SBNMJUTDIM-vQ/formResponse';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnEnviar.disabled = true;
      mensaje.style.color = '#333';
      mensaje.textContent = 'Enviando información...';

      const datos = new FormData(form);

      try {
        await fetch(FORM_URL, {
          method: 'POST',
          mode: 'no-cors', // Evita el bloqueo por políticas de origen cruzado
          body: datos
        });

        // Al usar no-cors, la respuesta es opaca, pero los datos llegan a Google Sheets
        mensaje.style.color = 'green';
        mensaje.textContent = '¡Datos enviados correctamente!';
        form.reset();
      } catch (error) {
        mensaje.style.color = 'red';
        mensaje.textContent = 'Ocurrió un error al enviar. Intenta nuevamente.';
        console.error(error);
      } finally {
        btnEnviar.disabled = false;
      }
    });
  </script>

</body>
</html>
