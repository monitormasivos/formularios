<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Servicio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .card-cover {
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
      padding: 2.2rem 1.5rem 1.8rem;
      text-align: center;
      color: #ffffff;
    }

    .cover-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 0.75rem auto;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .card-cover h2 {
      margin-bottom: 0.4rem;
      color: #ffffff;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-cover .subtitulo {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.9);
      margin: 0;
    }

    .card-body {
      padding: 1.75rem;
    }

    .campo {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #2d3748;
    }

    input {
      padding: 0.75rem;
      font-size: 0.95rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      padding: 0.85rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      margin-top: 0.5rem;
    }

    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
      opacity: 0.8;
    }

    #mensaje {
      margin-top: 1.25rem;
      font-weight: 600;
      font-size: 0.92rem;
      text-align: center;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Cover azul en la cabecera -->
    <div class="card-cover">
      <div class="cover-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h2>Registro de Datos</h2>
      <p class="subtitulo">Completa la información para enviarla a la hoja de cálculo</p>
    </div>

    <!-- Contenido del formulario -->
    <div class="card-body">
      <form id="miFormulario"
            action="https://docs.google.com/forms/d/e/1FAIpQLSdx5nLKsOm4EHEipdA_Nj6VlV09Wldb2wUkXRWQAxJkkOt1Ow/formResponse"
            method="POST"
            target="hidden_iframe">

        <div class="campo">
          <label for="nombre">Nombre y apellido:</label>
          <input type="text" id="nombre" name="entry.2005620554" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="entry.1045781291" placeholder="nombre@correo.com" required>
        </div>

        <div class="campo">
          <label for="telefono">Número telefónico:</label>
          <input type="tel" id="telefono" name="entry.1166974658" placeholder="+34 600 000 000" required>
        </div>

        <button type="submit" id="btnEnviar">Enviar datos</button>
      </form>

      <!-- iframe oculto para evitar redirección hacia Google Forms -->
      <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

      <p id="mensaje"></p>
    </div>
  </div>

  <script>
    // Referencias a los elementos del DOM
    const form = document.getElementById('miFormulario');
    const mensaje = document.getElementById('mensaje');
    const btnEnviar = document.getElementById('btnEnviar');
    const iframe = document.getElementById('hidden_iframe');

    let enviado = false;

    form.addEventListener('submit', () => {
      btnEnviar.disabled = true;
      mensaje.style.color = '#555';
      mensaje.textContent = 'Enviando información...';
      enviado = true;
    });

    iframe.addEventListener('load', () => {
      if (enviado) {
        mensaje.style.color = '#0e7a0d';
        mensaje.textContent = '¡Tus respuestas se registraron correctamente!';
        btnEnviar.disabled = false;
        form.reset();
        enviado = false;
      }
    });
  </script>

</body>
</html>
