<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      max-width: 450px;
    }
    .campo {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }
    input {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input:focus {
      outline: none;
      border-color: #0066cc;
    }
    button {
      padding: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      width: 100%;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    #mensaje {
      margin-top: 1rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Registro de Datos</h2>

  <form id="miFormulario"
        action="https://docs.google.com/forms/d/e/1FAIpQLSdx5nLKsOm4EHEipdA_Nj6VlV09Wldb2wUkXRWQAxJkkOt1Ow/formResponse"
        method="POST"
        target="hidden_iframe">

    <div class="campo">
      <label for="nombre">Nombre y apellido:</label>
      <input type="text" id="nombre" name="entry.2005620554" required>
    </div>

    <div class="campo">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="entry.1045781291" required>
    </div>

    <div class="campo">
      <label for="telefono">Número telefónico:</label>
      <input type="tel" id="telefono" name="entry.1166974658" required>
    </div>

    <button type="submit" id="btnEnviar">Enviar datos</button>
  </form>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <p id="mensaje"></p>

  <script>
    const form = document.getElementById('miFormulario');
    const mensaje = document.getElementById('mensaje');
    const btnEnviar = document.getElementById('btnEnviar');
    const iframe = document.getElementById('hidden_iframe');

    let enviado = false;

    form.addEventListener('submit', () => {
      btnEnviar.disabled = true;
      mensaje.style.color = '#555';
      mensaje.textContent = 'Enviando información...';
      enviado = true;
    });

    iframe.addEventListener('load', () => {
      if (enviado) {
        mensaje.style.color = 'green';
        mensaje.textContent = '¡Datos registrados correctamente en la hoja!';
        btnEnviar.disabled = false;
        form.reset();
        enviado = false;
      }
    });
  </script>

</body>
</html>
