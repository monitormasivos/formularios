<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Formulario Personalizado</title>
  <style>
    /* Estilos básicos */
    form { max-width: 400px; margin: 20px auto; font-family: sans-serif; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
    #mensajeExito { display: none; color: green; font-weight: bold; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

  <!-- Le agregamos un ID al formulario para controlarlo con JavaScript -->
  <form id="miFormulario Google">
    
    <label>Pregunta 1:</label>
    <input type="text" name="entry.1091301635" required>

    <label>Pregunta 2:</label>
    <input type="text" name="entry.1660275454" required>

    <label>Pregunta 3:</label>
    <input type="text" name="entry.1398348628" required>

    <label>Pregunta 4:</label>
    <input type="text" name="entry.1915320890" required>

    <label>Pregunta 5:</label>
    <input type="text" name="entry.951965866" required>

    <label>Pregunta 6:</label>
    <input type="text" name="entry.1122720499" required>

    <button type="submit">Enviar Respuestas</button>
    
    <!-- Este mensaje se mostrará al enviar -->
    <p id="mensajeExito">¡Muchas gracias! Tus respuestas han sido registradas.</p>
  </form>

  <script>
    const formulario = document.getElementById('miFormularioGoogle');
    const mensaje = document.getElementById('mensajeExito');

    formulario.addEventListener('submit', function(e) {
      e.preventDefault(); // Evita que la página se recargue o redirija

      // Tu URL de Google Forms modificada a formResponse
      const url = 'https://docs.google.com/forms/u/0/d/1drKQ17nO_L5sDtnkR75N9W2uyTpG06d8_it4hTLLGAM/formResponse';
      
      // Empaqueta automáticamente todos los campos del formulario
      const datos = new FormData(formulario);

      // Envía los datos en segundo plano
      fetch(url, {
        method: 'POST',
        body: datos,
        mode: 'no-cors' // Crucial para saltar las restricciones de Google sin Apps Script
      })
      .then(() => {
        // Acciones tras enviar el formulario con éxito
        mensaje.style.display = 'block'; // Muestra el mensaje de éxito
        formulario.reset();              // Limpia las casillas del formulario
      })
      .catch(error => {
        console.error('Error al enviar:', error);
        alert('Hubo un problema al enviar el formulario.');
      });
    });
  </script>

</body>
</html>
